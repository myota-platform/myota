server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  resolver ${MYOTA_DNS_RESOLVER} valid=10s ipv6=off;
  set $myota_gateway ${MYOTA_GATEWAY_UPSTREAM};
  set $myota_grafana ${MYOTA_GRAFANA_UPSTREAM};
  client_max_body_size 1g;
  client_body_timeout 3600s;
  add_header Cache-Control "no-store" always;
  # OSM's tile policy requires a valid HTTP Referer for browser tile requests.
  # strict-origin-when-cross-origin keeps the origin while avoiding path data.
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  location /v1/ {
    proxy_pass http://$myota_gateway;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host myota-admin-web;
  }
  location = /observability {
    return 308 /observability/;
  }
  location = /_observability_auth {
    internal;
    proxy_pass http://$myota_gateway/_internal/grafana/auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization "Bearer $cookie_myota_admin_access";
  }
  location ^~ /observability/ {
    auth_request /_observability_auth;
    auth_request_set $grafana_user $upstream_http_x_myota_grafana_user;
    auth_request_set $grafana_name $upstream_http_x_myota_grafana_name;
    auth_request_set $grafana_email $upstream_http_x_myota_grafana_email;
    auth_request_set $grafana_role $upstream_http_x_myota_grafana_role;
    error_page 401 403 =302 /login;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Prefix /observability;
    proxy_set_header X-WEBAUTH-USER $grafana_user;
    proxy_set_header X-WEBAUTH-NAME $grafana_name;
    proxy_set_header X-WEBAUTH-EMAIL $grafana_email;
    proxy_set_header X-WEBAUTH-ROLE $grafana_role;
    proxy_set_header Authorization "";
    proxy_pass http://$myota_grafana;
  }
  location = /healthz {
    proxy_pass http://$myota_gateway/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host myota-admin-web;
  }
  location / { try_files $uri $uri/ /index.html; }
}
