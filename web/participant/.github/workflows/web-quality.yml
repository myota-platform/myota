name: Web quality

on:
  push:
    branches: [main, testing, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, testing]

permissions:
  contents: read

jobs:
  static-check:
    name: Static checks and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: node --check web/app.js
      - name: Test static site structure
        run: python -m unittest discover -s tests -v

  build-artifact:
    name: Build static site artifact
    needs: [static-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir -p dist
          cp -R web/. dist/
      - name: Upload immutable CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: myota-web-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'testing')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare image tags
        id: image-tags
        env:
          IMAGE_NAME: ghcr.io/myota-platform/myota-web
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "tags=${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_NAME}" == "testing" ]]; then
            {
              echo "tags<<EOF"
              echo "${IMAGE_NAME}:testing"
              echo "${IMAGE_NAME}:testing-${GITHUB_SHA}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE_NAME}:ci-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and publish static site image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'testing') }}
          tags: ${{ steps.image-tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}
