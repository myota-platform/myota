{{- if .Values.adminWeb.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myota-admin-web
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: myota, app.kubernetes.io/component: admin-web}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: myota, app.kubernetes.io/component: admin-web}
      annotations:
        rollout.myota.dev/image-digest: {{ .Values.imageRollout.digests.adminWeb | default "untracked" | quote }}
    spec:
      containers:
        - name: admin-web
          image: {{ include "myota.imageReference" (dict "repository" .Values.adminWeb.imageRepository "tag" (default .Values.image.tag .Values.adminWeb.imageTag) "digest" .Values.imageRollout.digests.adminWeb) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: MYOTA_GATEWAY_UPSTREAM
              value: {{ .Values.adminWeb.gatewayUpstream | quote }}
            - name: MYOTA_GRAFANA_UPSTREAM
              value: {{ printf "%s:%v" (include "myota.fullname" (dict "name" "grafana")) .Values.observability.grafana.servicePort | quote }}
          ports: [{name: http, containerPort: {{ .Values.adminWeb.port }}}]
          readinessProbe: {httpGet: {path: /healthz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}}
          resources: {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: myota-admin-web
  labels: {app.kubernetes.io/name: myota, app.kubernetes.io/component: admin-web}
spec:
  type: {{ .Values.adminWeb.serviceType }}
  selector: {app.kubernetes.io/name: myota, app.kubernetes.io/component: admin-web}
  ports: [{name: http, port: {{ .Values.adminWeb.servicePort }}, targetPort: http}]
{{- end }}
