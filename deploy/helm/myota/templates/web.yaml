{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myota-web
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: myota, app.kubernetes.io/component: web}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: myota, app.kubernetes.io/component: web}
      annotations:
        rollout.myota.dev/image-digest: {{ .Values.imageRollout.digests.web | default "untracked" | quote }}
    spec:
      containers:
        - name: web
          image: {{ include "myota.imageReference" (dict "repository" .Values.web.imageRepository "tag" (default .Values.image.tag .Values.web.imageTag) "digest" .Values.imageRollout.digests.web) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          ports: [{name: http, containerPort: {{ .Values.web.port }}}]
          readinessProbe: {httpGet: {path: /, port: http}}
          livenessProbe: {httpGet: {path: /, port: http}}
          resources: {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: myota-web
  labels: {app.kubernetes.io/name: myota, app.kubernetes.io/component: web}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: myota, app.kubernetes.io/component: web}
  ports: [{name: http, port: {{ .Values.web.servicePort }}, targetPort: http}]
{{- end }}
