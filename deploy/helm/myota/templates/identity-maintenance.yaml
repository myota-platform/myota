{{- if .Values.auth.maintenanceEnabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myota-identity-maintenance
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: myota, app.kubernetes.io/component: identity-maintenance}}
  template:
    metadata: {labels: {app.kubernetes.io/name: myota, app.kubernetes.io/component: identity-maintenance}}
    spec:
      initContainers:
        {{ include "myota.waitForSchema" (dict "root" . "databaseUrlKey" "core-database-url") | nindent 8 }}
      containers:
        - name: identity-maintenance
          image: {{ include "myota.imageReference" (dict "repository" (default .Values.image.repository .Values.services.identity.imageRepository) "tag" (default .Values.image.tag .Values.services.identity.imageTag) "digest" .Values.imageRollout.digests.identity) | quote }}
          command: ["python3", "identity_maintenance.py"]
          env:
            - name: CORE_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.postgres.existingSecret }}, key: core-database-url}}
            - name: MYOTA_REQUIRE_DURABILITY
              value: "1"
            - name: MYOTA_ENV
              value: {{ .Values.auth.environment | quote }}
            - name: MYOTA_AUTH_SIGNING_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.auth.existingSecret }}, key: signing-key}}
            - name: MYOTA_OBJECT_STORAGE_ENDPOINT
              value: {{ .Values.objectStorage.endpoint | quote }}
            - name: MYOTA_PROFILE_IMAGE_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.objectStorage.profileImageExistingSecret }}, key: {{ .Values.objectStorage.profileImageAccessKeyKey }}}}
            - name: MYOTA_PROFILE_IMAGE_SECRET_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.objectStorage.profileImageExistingSecret }}, key: {{ .Values.objectStorage.profileImageSecretKeyKey }}}}
            - name: MYOTA_PROFILE_IMAGE_BUCKET
              value: {{ .Values.objectStorage.profileImageBucket | quote }}
{{- end }}
