{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: myota-postgres-init
  labels:
    app.kubernetes.io/name: myota
    app.kubernetes.io/component: database-init
data:
  020-create-app-role.sh: |
    #!/bin/bash
    set -euo pipefail
    psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
      --set=app_password="$MYOTA_APP_PASSWORD" \
      --set=database_name="$POSTGRES_DB" <<'SQL'
    CREATE ROLE myota_app LOGIN PASSWORD :'app_password';
    GRANT CONNECT ON DATABASE :"database_name" TO myota_app;
    GRANT USAGE, CREATE ON SCHEMA public TO myota_app;
    ALTER DEFAULT PRIVILEGES FOR ROLE myota_admin IN SCHEMA public
      GRANT ALL ON TABLES TO myota_app;
    ALTER DEFAULT PRIVILEGES FOR ROLE myota_admin IN SCHEMA public
      GRANT ALL ON SEQUENCES TO myota_app;
    SQL
---
{{- range $database, $config := dict
  "core" (dict "name" "myota-core-postgres" "database" $.Values.postgres.coreDatabase "storage" $.Values.postgres.coreStorageSize "image" $.Values.postgres.image)
  "activity" (dict "name" "myota-activity-postgres" "database" $.Values.postgres.activityDatabase "storage" $.Values.postgres.activityStorageSize "image" $.Values.postgres.image)
  "geo" (dict "name" "myota-geo-postgis" "database" $.Values.postgres.geoDatabase "storage" $.Values.postgres.geoStorageSize "image" $.Values.postgres.postgisImage) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $config.name }}
  labels:
    app.kubernetes.io/name: myota
    app.kubernetes.io/component: {{ $database }}-database
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: myota
    app.kubernetes.io/component: {{ $database }}-database
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $config.name }}
  labels:
    app.kubernetes.io/name: myota
    app.kubernetes.io/component: {{ $database }}-database
spec:
  serviceName: {{ $config.name }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: myota
      app.kubernetes.io/component: {{ $database }}-database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: myota
        app.kubernetes.io/component: {{ $database }}-database
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgresql
          image: {{ $config.image | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            - name: POSTGRES_DB
              value: {{ $config.database | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.postgres.existingSecret }}
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.postgres.existingSecret }}
                  key: password
            - name: MYOTA_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.postgres.existingSecret }}
                  key: app-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgresql
              containerPort: 5432
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d/020-create-app-role.sh
              subPath: 020-create-app-role.sh
          resources: {{- toYaml $.Values.postgres.resources | nindent 12 }}
      volumes:
        - name: initdb
          configMap:
            name: myota-postgres-init
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- if $.Values.postgres.storageClassName }}
        storageClassName: {{ $.Values.postgres.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $config.storage | quote }}
---
{{- end }}
{{- end }}
