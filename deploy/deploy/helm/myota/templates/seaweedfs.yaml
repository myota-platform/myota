{{- if .Values.seaweedfs.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: myota-seaweedfs-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.seaweedfs.storageSize | quote }}
  {{- if .Values.seaweedfs.storageClassName }}
  storageClassName: {{ .Values.seaweedfs.storageClassName | quote }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myota-seaweedfs
  labels: {app.kubernetes.io/name: myota, app.kubernetes.io/component: seaweedfs}
spec:
  replicas: 1
  # SeaweedFS mini embeds filer state on the single-writer PVC. A rolling
  # surge starts two processes against the same LevelDB directory and fails
  # its lock; stop the old pod before attaching the volume to the replacement.
  strategy:
    type: Recreate
  selector: {matchLabels: {app.kubernetes.io/name: myota, app.kubernetes.io/component: seaweedfs}}
  template:
    metadata: {labels: {app.kubernetes.io/name: myota, app.kubernetes.io/component: seaweedfs}}
    spec:
      containers:
        - name: seaweedfs
          image: {{ .Values.seaweedfs.image | quote }}
          command:
            - weed
            - mini
            - -dir=/data
            - -ip.bind=0.0.0.0
            - -metricsPort={{ .Values.seaweedfs.metricsPort }}
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.objectStorage.existingSecret }}
                  key: {{ .Values.objectStorage.accessKeyKey }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.objectStorage.existingSecret }}
                  key: {{ .Values.objectStorage.secretKeyKey }}
          ports:
            - {name: s3, containerPort: 8333}
            - {name: filer, containerPort: 8888}
            - {name: metrics, containerPort: {{ .Values.seaweedfs.metricsPort }}}
          # The S3 status endpoint is a small, body-less health response. The
          # filer root is an HTML directory page and is not suitable for a
          # probe because clients may disconnect while the template renders.
          readinessProbe: {httpGet: {path: /status, port: s3}}
          livenessProbe: {httpGet: {path: /status, port: s3}}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: myota-seaweedfs-data}}]
---
apiVersion: v1
kind: Service
metadata:
  name: myota-seaweedfs
  labels: {app.kubernetes.io/name: myota, app.kubernetes.io/component: seaweedfs}
spec:
  selector: {app.kubernetes.io/name: myota, app.kubernetes.io/component: seaweedfs}
  ports:
    - {name: s3, port: 8333, targetPort: s3}
    - {name: filer, port: 8888, targetPort: filer}
    - {name: metrics, port: {{ .Values.seaweedfs.metricsPort }}, targetPort: metrics}
{{- end }}
