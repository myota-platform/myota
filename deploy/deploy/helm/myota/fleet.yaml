defaultNamespace: myota
helm:
  chart: .
  releaseName: myota
  valuesFiles:
    - values-spainip.yaml
    - values-image-digests.yaml
  waitForJobs: true
  timeoutSeconds: 1800
  # Preserve database StatefulSets and failed migration Jobs for inspection;
  # an atomic uninstall can otherwise remove the workloads needed to recover.
  atomic: false
