name: Update testing image digests

on:
  schedule:
    # Offset from minute 00, a documented high-load boundary for Actions schedules.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: myota-testing-image-digest-sync
  cancel-in-progress: false

jobs:
  propose-digest-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether the MyOTA-scoped GitHub App is configured
        id: app-config
        env:
          APP_ID: ${{ vars.TESTING_DIGEST_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.TESTING_DIGEST_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_ID" || -z "$APP_PRIVATE_KEY" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Testing image polling is inactive until the MyOTA-scoped App credentials are configured for this repository."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Create short-lived MyOTA token
        if: steps.app-config.outputs.configured == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.TESTING_DIGEST_APP_ID }}
          private-key: ${{ secrets.TESTING_DIGEST_APP_PRIVATE_KEY }}
          owner: myota-platform
          repositories: myota
          permission-contents: write
          permission-pull-requests: write

      - name: Check out the testing deployment configuration
        if: steps.app-config.outputs.configured == 'true'
        uses: actions/checkout@v6
        with:
          repository: myota-platform/myota
          ref: testing
          path: myota
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
          fetch-depth: 0

      - name: Install crane
        if: steps.app-config.outputs.configured == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Resolve published testing image digests
        if: steps.app-config.outputs.configured == 'true'
        working-directory: myota
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@v0.20.3
          export PATH="$(go env GOPATH)/bin:$PATH"
          python3 scripts/sync-image-digests.py --tag testing

      - name: Stop when no digest changed or a digest PR is already open
        if: steps.app-config.outputs.configured == 'true'
        id: diff
        working-directory: myota
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if git diff --quiet -- deploy/helm/myota-test/values-image-digests-testing.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "All published testing image digests are already recorded."
            exit 0
          fi

          open_pr="$(gh pr list \
            --repo myota-platform/myota \
            --state open \
            --base testing \
            --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("automation/testing-image-digests-"))][0].number // empty')"
          if [[ -n "$open_pr" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Digest PR #$open_pr is still open; no duplicate PR will be created."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          cp deploy/helm/myota-test/values-image-digests-testing.yaml \
            "$RUNNER_TEMP/values-image-digests-testing.yaml"
          git restore -- deploy/helm/myota-test/values-image-digests-testing.yaml

      - name: Propose the immutable digest update
        if: steps.diff.outputs.changed == 'true'
        working-directory: myota
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: myota-platform/myota
        run: |
          branch="automation/testing-image-digests-${GITHUB_RUN_ID}"
          git checkout -b "$branch" origin/testing
          cp "$RUNNER_TEMP/values-image-digests-testing.yaml" \
            deploy/helm/myota-test/values-image-digests-testing.yaml
          git diff --check
          git add deploy/helm/myota-test/values-image-digests-testing.yaml
          git config user.name "myota-testing-image-sync[bot]"
          git config user.email "myota-testing-image-sync[bot]@users.noreply.github.com"
          git commit \
            -m "chore(deploy): roll out testing service images" \
            -m "Record current public GHCR testing digests for Fleet. The protected testing branch is updated only through a PR and its required checks."
          git push origin "$branch"

          cat > "$RUNNER_TEMP/testing-digest-pr.md" <<'EOF'
          ## Summary

          - Record the published GHCR `testing` image digests in the isolated
            `myota-test` Helm values.
          - Let Fleet roll workloads only after the protected testing-branch
            PR passes its required checks.

          This PR was generated by the MyOTA monorepo testing-image digest
          workflow. It changes only `deploy/helm/myota-test/values-image-digests-testing.yaml`.
          EOF
          gh pr create \
            --repo "$GH_REPO" \
            --base testing \
            --head "$branch" \
            --title "chore(deploy): roll out testing service images" \
            --body-file "$RUNNER_TEMP/testing-digest-pr.md"
          pr_number="$(gh pr list \
            --repo "$GH_REPO" \
            --state open \
            --base testing \
            --head "$branch" \
            --json number \
            --jq '.[0].number')"
          gh pr merge "$pr_number" --repo "$GH_REPO" --auto --squash
