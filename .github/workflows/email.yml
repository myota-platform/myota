name: MyOTA email core checks

on:
  push:
    branches: [main, testing, 'feature/**', 'fix/**']
    paths:
      - "apps/email/**"
      - ".github/workflows/email.yml"
  pull_request:
    branches: [main, testing]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  email-core:
    name: Validate email command handling
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/email
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned linter
        run: python -m pip install ruff==0.16.10
      - name: Check formatting and lint
        run: |
          ruff check email_core.py tests
          ruff format --check email_core.py tests
      - name: Run email core tests
        run: python -m unittest discover -s tests -v
