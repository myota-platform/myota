name: MyOTA email service checks

on:
  push:
    branches: [main, testing, 'feature/**', 'fix/**']
    paths:
      - "apps/email/**"
      - "deploy/**"
      - ".github/workflows/email.yml"
  pull_request:
    branches: [main, testing]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  email-service:
    name: Validate and build email service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/email
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned linter
        run: python -m pip install ruff==0.16.10
      - name: Check formatting and lint
        run: |
          ruff check .
          ruff format --check .
      - name: Install email service dependencies
        run: python -m pip install -r requirements.txt
      - name: Run email service tests
        run: python -m unittest discover -s tests -v
      - name: Build service image without publishing
        run: docker build -f Dockerfile -t myota-email-service:ci .
        working-directory: apps/email

  publish-testing-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/testing'
    needs: [email-service]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable Testing image tags
        uses: docker/build-push-action@v6
        with:
          context: ./apps/email
          file: ./apps/email/Dockerfile
          push: true
          tags: |
            ghcr.io/myota-platform/myota-email-service:testing
            ghcr.io/myota-platform/myota-email-service:testing-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.ref.name=testing
