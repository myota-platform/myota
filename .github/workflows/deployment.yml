name: MyOTA deployment checks and image

on:
  push:
    branches: [main, testing, 'feature/**', 'fix/**']
    paths:
      - "deploy/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main, testing]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    defaults:
      run:
        working-directory: deploy
    name: Run deployment runtime tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PYTHONPATH: services
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run deployment runtime tests
        run: python -m unittest discover -s tests -v

  build-and-publish:
    defaults:
      run:
        working-directory: deploy
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - myota-service
          - myota-gateway
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'testing')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare image tags
        id: image-tags
        env:
          IMAGE_NAME: ghcr.io/myota-platform/${{ matrix.image }}
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "tags=${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_NAME}" == "testing" ]]; then
            {
              echo "tags<<EOF"
              echo "${IMAGE_NAME}:testing"
              echo "${IMAGE_NAME}:testing-${GITHUB_SHA}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE_NAME}:ci-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ./deploy
          push: ${{ github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'testing') }}
          tags: ${{ steps.image-tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}
